apiVersion: apps/v1
kind: Deployment
metadata: { name: zolt-app }
spec:
  replicas: 2
  selector: { matchLabels: { app: zolt-app } }
  template:
    metadata: { labels: { app: zolt-app } }
    spec:
      containers:
        - name: app
          image: zolt-app:latest
          ports: [{ containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 15 }
