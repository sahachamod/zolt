name: Publish
on:
  push:
    tags: ["v*.*.*"]
jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - run: pnpm security:check
      - run: pnpm -r --filter './packages/**' --filter create-zolt publish --no-git-checks
      - uses: softprops/action-gh-release@v2
        with: { generate_release_notes: true }
